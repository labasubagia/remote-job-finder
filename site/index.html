<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote Jobs</title>
    <style>
    :root {
      color-scheme: light dark;
      --line: #8884;
      --muted: #808080;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0 auto;
      max-width: 64rem;
      padding: 2rem 1.25rem 4rem;
      font:
        15px / 1.6 system-ui,
        sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
    }
    #chips + header {
      margin-top: 1.1rem;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 auto 0 0;
    }
    input,
    select {
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: Canvas;
      color: CanvasText;
    }
    select option {
      background: Canvas;
      color: CanvasText;
    }
    input {
      flex: 1 1 16rem;
    }
    #chips {
      /* ten chips, two rows of five: flex wrapping left an orphan on its own row */
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.4rem;
      margin-top: 1rem;
    }
    @media (max-width: 48rem) {
      /* five columns below ~48rem squeeze chip labels onto two lines */
      #chips {
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        grid-template-columns: none;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 0.15rem;
      }
      #chips::-webkit-scrollbar {
        display: none;
      }
    }
    #meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 1.25rem 0 0.5rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      padding: 1.1rem 0;
      border-top: 1px solid var(--line);
      /* 1000+ rows: only paint and lay out the ones near the viewport */
      content-visibility: auto;
      contain-intrinsic-size: auto 110px;
    }
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2rem;
      height: 1.5rem;
      margin-right: 0.75rem;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.25rem;
      flex-shrink: 0;
    }
    li {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.5rem 0.75rem;
    }
    li > a {
      flex: 1 1 calc(100% - 3rem);
      min-width: 0;
    }
    .sub,
    .why,
    .tags {
      width: 100%;
    }
    li a {
      font-weight: 600;
      text-decoration: none;
    }
    li a:hover {
      text-decoration: underline;
    }
    .sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.2rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.55rem;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.05rem 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.45rem 0.7rem;
      font:
        0.82rem / 1.35 system-ui,
        sans-serif;
      background: Canvas;
      color: CanvasText;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      font-weight: 600;
      border-color: currentColor;
    }
    .why {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    footer a {
      color: inherit;
    }
    </style>
  </head>
  <body>
    <header>
      <h1>Remote jobs</h1>
      <input id="q" type="search" placeholder="Search title, company, tags, description" autocomplete="off">
    </header>
    <div id="chips"></div>
    <header>
      <select id="sort">
        <option value="best">Best match</option>
        <option value="new">Newest</option>
      </select>
      <select id="src">
        <option value="">All sources</option>
      </select>
      <select id="geo">
        <option value="">Any location / timezone</option>
        <option value="my-tz">My timezone</option>
        <option value="americas">Americas (UTC-10 to UTC-3)</option>
        <option value="emea">EMEA (UTC-1 to UTC+4)</option>
        <option value="apac">APAC (UTC+5 to UTC+12)</option>
        <option value="worldwide">Worldwide / Anywhere</option>
      </select>
      <input
        id="tzTolerance"
        type="number"
        min="0"
        max="12"
        value="2"
        step="1"
        title="Timezone tolerance in hours"
        style="width: 4rem; display: none;"
      >
    </header>
    <p id="meta">Loading…</p>
    <ul id="list"></ul>
    <script type="module">
    import { init } from "./app.mjs";

    init().catch((err) => {
      document.getElementById("meta").textContent = `Could not load jobs (${err.message}).`;
    });
    </script>
  </body>
</html>
