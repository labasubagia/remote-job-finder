<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote Jobs</title>
    <style>
    :root {
      color-scheme: light dark;
      --line: #8884;
      --muted: #808080;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0 auto;
      max-width: 64rem;
      padding: 2rem 1.25rem 4rem;
      font:
        15px / 1.6 system-ui,
        sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
    }
    #chips + header {
      margin-top: 1.1rem;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 auto 0 0;
    }
    input,
    select {
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: Canvas;
      color: CanvasText;
    }
    select option {
      background: Canvas;
      color: CanvasText;
    }
    input {
      flex: 1 1 16rem;
    }
    #chips {
      /* ten chips, two rows of five: flex wrapping left an orphan on its own row */
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.4rem;
      margin-top: 1rem;
    }
    @media (max-width: 48rem) {
      /* five columns below ~48rem squeeze chip labels onto two lines */
      #chips {
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        grid-template-columns: none;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 0.15rem;
      }
      #chips::-webkit-scrollbar {
        display: none;
      }
    }
    #meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 1.25rem 0 0.5rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      padding: 1.1rem 0;
      border-top: 1px solid var(--line);
      /* 1000+ rows: only paint and lay out the ones near the viewport */
      content-visibility: auto;
      contain-intrinsic-size: auto 110px;
    }
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2rem;
      height: 1.5rem;
      margin-right: 0.75rem;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.25rem;
      flex-shrink: 0;
    }
    li {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.5rem 0.75rem;
    }
    li > a {
      flex: 1 1 calc(100% - 3rem);
      min-width: 0;
    }
    .sub,
    .why,
    .tags {
      width: 100%;
    }
    li a {
      font-weight: 600;
      text-decoration: none;
    }
    li a:hover {
      text-decoration: underline;
    }
    .sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.2rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.55rem;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.05rem 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.45rem 0.7rem;
      font:
        0.82rem / 1.35 system-ui,
        sans-serif;
      background: Canvas;
      color: CanvasText;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      font-weight: 600;
      border-color: currentColor;
    }
    .why {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    footer a {
      color: inherit;
    }
    </style>
  </head>
  <body>
    <header>
      <h1>Remote jobs</h1>
      <input
        id="p"
        type="search"
        placeholder="Your preferences — e.g. backend Go, customer support, no on-call"
        autocomplete="off"
      >
    </header>
    <div id="chips"></div>
    <header>
      <input id="q" type="search" placeholder="Search title, company, tags, description" autocomplete="off">
      <select id="sort">
        <option value="best">Best match</option>
        <option value="new">Newest</option>
      </select>
      <select id="src">
        <option value="">All sources</option>
      </select>
    </header>
    <p id="meta">Loading…</p>
    <ul id="list"></ul>
    <footer>
      Data refreshed daily. Sources:
      <a href="https://remoteok.com" rel="noopener">Remote OK</a>
      ·
      <a href="https://remotive.com" rel="noopener">Remotive</a>
      ·
      <a href="https://www.arbeitnow.com" rel="noopener">Arbeitnow</a>
      ·
      <a href="https://himalayas.app" rel="noopener">Himalayas</a>
      ·
      <a href="https://weworkremotely.com" rel="noopener">We Work Remotely</a>.
    </footer>
    <script type="module">
    import { jobMatches, matchedTerms, PROFILE_KEY, rankJobs, searchScore, terms } from "./search.mjs";

    const esc = (s) =>
      String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const RTF = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
    const ago = (iso) => {
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return "unknown date";
      return RTF.format(-Math.floor(Math.max(0, Date.now() - t) / 864e5), "day");
    };
    const p = document.getElementById("p");
    const q = document.getElementById("q");
    const src = document.getElementById("src");
    const sort = document.getElementById("sort");
    const chips = document.getElementById("chips");
    const list = document.getElementById("list");
    const meta = document.getElementById("meta");
    const ROLES = [
      "Software engineer",
      "Data scientist",
      "Product designer",
      "Marketing",
      "Customer support",
      "Sales",
      "HR / recruiter",
      "DevOps / SRE",
      "Machine learning",
      "Engineering manager",
    ];
    let jobs = [];
    const save = (value) => {
      try {
        localStorage.setItem(PROFILE_KEY, value);
      } catch {
        // private mode or storage disabled: the page still works, the profile just is not remembered
      }
    };

    const picked = () =>
      p.value
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);

    function syncChips() {
      const on = new Set(picked().map((s) => s.toLowerCase()));
      for (const b of chips.children) b.setAttribute("aria-pressed", String(on.has(b.textContent.toLowerCase())));
    }

    function render() {
      const needle = q.value.trim();
      const pick = src.value;
      const profile = p.value.trim();
      let shown = jobs.filter((j) => (!pick || j.source === pick) && jobMatches(needle, j));
      // A query means "find this specific job": relevance order beats profile order, unless the user asked for newest.
      const newest = (a, b) => Date.parse(b.postedAt) - Date.parse(a.postedAt);
      const ranked = !needle && sort.value === "best" && Boolean(profile);
      if (needle && sort.value === "new") {
        shown.sort(newest);
      } else if (needle) {
        shown.sort((a, b) => searchScore(needle, b) - searchScore(needle, a) || newest(a, b));
      } else if (ranked) {
        const wanted = terms(profile);
        shown = rankJobs(shown, profile).map(({ job }) => ({ ...job, why: matchedTerms(wanted, job) }));
      } else {
        shown.sort(newest);
      }
      const clip = (s) => (s.length > 32 ? `${s.slice(0, 32)}…` : s);
      const suffix = needle
        ? ` · ${sort.value === "new" ? "newest" : "best"} matches for "${clip(needle)}"`
        : ranked
          ? ` · ranked for "${clip(profile)}"`
          : "";
      meta.textContent = `${shown.length} of ${jobs.length} remote jobs · ${new Date().toLocaleDateString()}${suffix}`;
      list.innerHTML = shown.length
        ? shown
            .map(
              (j, i) => `<li>
          <span class="num">${i + 1}</span>
          <a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
          <div class="sub">${esc(j.company)} · ${esc(j.source)} · ${ago(j.postedAt)}</div>
          ${j.why?.length ? `<div class="why">match: ${esc(j.why.join(" · "))}</div>` : ""}
          <div class="tags">${j.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        </li>`,
            )
            .join("")
        : `<li class="sub">No matches.</li>`;
    }

    fetch("./jobs.json")
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
      .then((data) => {
        jobs = Array.isArray(data) ? data : [];
        for (const s of [...new Set(jobs.map((j) => j.source))].sort()) {
          src.insertAdjacentHTML(
            "beforeend",
            `<option value="${esc(s)}">${esc(s)} (${jobs.filter((j) => j.source === s).length})</option>`,
          );
        }
        if (!jobs.length) meta.textContent = "No jobs published yet — run npm run fetch.";
        render();
      })
      .catch((err) => (meta.textContent = `Could not load jobs.json (${err.message}).`));
    chips.innerHTML = ROLES.map(
      (r) => `<button type="button" class="chip" aria-pressed="false">${esc(r)}</button>`,
    ).join("");
    chips.addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      const rest = picked();
      const i = rest.findIndex((s) => s.toLowerCase() === b.textContent.toLowerCase());
      if (i >= 0) rest.splice(i, 1);
      else rest.push(b.textContent);
      p.value = rest.join(", ");
      save(p.value);
      syncChips();
      render();
    });
    p.addEventListener("input", () => {
      save(p.value);
      syncChips();
      render();
    });
    try {
      p.value = localStorage.getItem(PROFILE_KEY) ?? "";
    } catch {
      p.value = "";
    }
    syncChips();
    sort.addEventListener("change", render);
    q.addEventListener("input", render);
    src.addEventListener("change", render);
    </script>
  </body>
</html>
