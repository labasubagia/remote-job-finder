name: jobs

on:
  schedule:
    - cron: "17 6 * * *" # daily; GitHub may delay a few minutes at peak
  push:
    branches: [main] # a merge must ship the new site, not wait for 06:17
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Role cache key
        id: roles
        run: |
          node -e 'const r = require("./scripts/roles.json"); console.log(`key=laya-${r.revision.slice(0, 8)}-v${r.version}-t${Math.round(r.threshold * 100)}`); console.log(`revision=${r.revision}`);' >> "$GITHUB_OUTPUT"
      - name: Restore previous roles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/previous-jobs.json
          key: roles-${{ steps.roles.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: roles-${{ steps.roles.outputs.key }}-
      - name: Restore Laya weights
        id: hf
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-laya-${{ steps.roles.outputs.revision }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: scripts/requirements-roles.txt
      - name: Install classifier
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r scripts/requirements-roles.txt \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match
      - name: Test pipeline
        run: npm test
      - name: Fetch jobs
        run: node scripts/fetch-jobs.mjs --out site/jobs.json
      - name: Classify new jobs
        id: classify
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OMP_NUM_THREADS: "4"
        run: .venv/bin/python scripts/classify-roles.py
      - name: Apply roles
        run: node scripts/apply-roles.mjs
      - name: Save roles cache
        if: steps.classify.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/previous-jobs.json
          key: roles-${{ steps.roles.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Laya weights
        if: steps.hf.outputs.cache-hit != 'true' && steps.classify.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-laya-${{ steps.roles.outputs.revision }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
