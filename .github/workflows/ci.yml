name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Fetch jobs (smoke)
        run: node scripts/fetch-jobs.mjs --out /tmp/jobs.json
      - name: Validate JSON
        run: node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/jobs.json')); if(!d.length) throw new Error('empty'); console.log(d.length+' jobs ok')"
